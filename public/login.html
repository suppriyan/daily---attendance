<!DOCTYPE html>

<html>

<head>

<title>Student Login</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

}

.container {

    width: 380px;

    background: white;

    padding: 35px;

    border-radius: 20px;

    text-align: center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.25);

}

.logo {

    font-size: 55px;

}

h1 {

    color: #5b21b6;

}

input {

    width: 100%;

    padding: 14px;

    margin: 10px 0;

    border: 1px solid #ccc;

    border-radius: 10px;

    font-size: 16px;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 15px;

    border: none;

    border-radius: 10px;

    background: #6d28d9;

    color: white;

    font-size: 16px;

    cursor: pointer;

}

button:hover {

    background: #4c1d95;

}

#message {

    margin-top: 15px;

    font-weight: bold;

}

</style>

</head>


<body>

<div class="container">

    <div class="logo">🎓</div>

    <h1>Student Login</h1>

    <p>Daily Attendance Management</p>


    <input
        type="text"
        id="reg_no"
        placeholder="Register Number"
    >


    <input
        type="password"
        id="password"
        placeholder="Password"
    >


    <button onclick="login()">

        🔐 Login

    </button>


    <p id="message"></p>

</div>


<script>

function login() {

    const reg_no =
        document.getElementById("reg_no").value;

    const password =
        document.getElementById("password").value;


    if (!reg_no || !password) {

        document.getElementById("message")
            .textContent =
            "Please enter all details";

        return;

    }


    fetch("/login", {

        method: "POST",

        headers: {

            "Content-Type":
                "application/json"

        },

        body: JSON.stringify({

            reg_no: reg_no,

            password: password

        })

    })

    .then(response =>
        response.json()
    )

    .then(data => {

        document.getElementById("message")
            .textContent =
            data.message;


        if (data.success) {

            window.location.href =
                "mobile.html?reg_no=" +
                encodeURIComponent(reg_no);

        }

    })

    .catch(error => {

        console.log(error);

        document.getElementById("message")
            .textContent =
            "Server error";

    });

}

</script>

</body>

</html>
