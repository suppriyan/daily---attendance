<!DOCTYPE html>
<html>

<head>

    <title>Daily Attendance Management</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

        }

        .container {

            width: 420px;

            background: white;

            padding: 35px;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.25);

        }

        .logo {

            font-size: 55px;

        }

        h1 {

            color: #5b21b6;

            margin-bottom: 8px;

        }

        .subtitle {

            color: #777;

            margin-bottom: 25px;

        }

        .tabs {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;

        }

        .tab {

            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            background: #e5e7eb;

            color: #333;

            font-weight: bold;

        }

        .tab.active {

            background: #6d28d9;

            color: white;

        }

        input {

            width: 100%;

            padding: 14px;

            margin: 8px 0;

            border: 2px solid #ddd;

            border-radius: 10px;

            font-size: 15px;

            outline: none;

        }

        input:focus {

            border-color: #6d28d9;

        }

        .main-button {

            width: 100%;

            padding: 14px;

            margin-top: 12px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .main-button:hover {

            transform: translateY(-2px);

        }

        .register-button {

            width: 100%;

            padding: 12px;

            margin-top: 10px;

            border: 2px solid #6d28d9;

            border-radius: 10px;

            background: white;

            color: #6d28d9;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }

        .register-button:hover {

            background: #f3e8ff;

        }

        #studentForm,
        #teacherForm,
        #registerForm {

            display: none;

        }

        #studentForm {

            display: block;

        }

        #message {

            margin-top: 15px;

            font-weight: bold;

        }

        .note {

            font-size: 13px;

            color: #777;

            margin-top: 10px;

        }

    </style>

</head>

<body>


<div class="container">

    <div class="logo">
        🎓
    </div>

    <h1>
        Daily Attendance
    </h1>

    <p class="subtitle">
        Student & Teacher Portal
    </p>


    <!-- LOGIN TYPE -->

    <div class="tabs">

        <button
            class="tab active"
            onclick="showStudent()">

            👨‍🎓 Student

        </button>

        <button
            class="tab"
            onclick="showTeacher()">

            👨‍🏫 Teacher

        </button>

    </div>


    <!-- STUDENT LOGIN -->

    <div id="studentForm">

        <input
            type="text"
            id="studentRegNo"
            placeholder="Register Number">

        <input
            type="password"
            id="studentPassword"
            placeholder="Password">

        <button
            class="main-button"
            onclick="studentLogin()">

            🔐 Student Login

        </button>

        <button
            class="register-button"
            onclick="showRegister()">

            📝 New Student? Create Account

        </button>

        <p class="note">
            Register number must start with 26CS
        </p>

    </div>


    <!-- TEACHER LOGIN -->

    <div id="teacherForm">

        <input
            type="text"
            id="teacherId"
            placeholder="Teacher ID">

        <input
            type="password"
            id="teacherPassword"
            placeholder="Password">

        <button
            class="main-button"
            onclick="teacherLogin()">

            🔐 Teacher Login

        </button>

        <p class="note">
            Teacher account is created by administrator.
        </p>

    </div>


    <!-- NEW STUDENT REGISTRATION -->

    <div id="registerForm">

        <h2>
            📝 Student Registration
        </h2>

        <input
            type="text"
            id="newRegNo"
            placeholder="Register Number (26CS001)">

        <input
            type="password"
            id="newPassword"
            placeholder="Create Password">

        <input
            type="text"
            id="newMobile"
            placeholder="Mobile Number">

        <button
            class="main-button"
            onclick="registerStudent()">

            ✅ Create Account

        </button>

        <button
            class="register-button"
            onclick="backToStudentLogin()">

            ← Back to Login

        </button>

    </div>


    <p id="message"></p>

</div>


<script>


/* SHOW STUDENT */

function showStudent() {

    document.getElementById("studentForm").style.display =
        "block";

    document.getElementById("teacherForm").style.display =
        "none";

    document.getElementById("registerForm").style.display =
        "none";

    document.querySelectorAll(".tab")[0].classList.add("active");

    document.querySelectorAll(".tab")[1].classList.remove("active");

    clearMessage();

}


/* SHOW TEACHER */

function showTeacher() {

    document.getElementById("studentForm").style.display =
        "none";

    document.getElementById("teacherForm").style.display =
        "block";

    document.getElementById("registerForm").style.display =
        "none";

    document.querySelectorAll(".tab")[0].classList.remove("active");

    document.querySelectorAll(".tab")[1].classList.add("active");

    clearMessage();

}


/* SHOW REGISTER */

function showRegister() {

    document.getElementById("studentForm").style.display =
        "none";

    document.getElementById("teacherForm").style.display =
        "none";

    document.getElementById("registerForm").style.display =
        "block";

    clearMessage();

}


/* BACK TO STUDENT LOGIN */

function backToStudentLogin() {

    showStudent();

}


/* MESSAGE */

function clearMessage() {

    document.getElementById("message").textContent = "";

}


/* STUDENT LOGIN */

function studentLogin() {

    const reg_no =
        document.getElementById("studentRegNo").value.trim();

    const password =
        document.getElementById("studentPassword").value;


    if (!reg_no || !password) {

        document.getElementById("message").textContent =
            "Please enter Register Number and Password";

        return;

    }


    if (!reg_no.toUpperCase().startsWith("26CS")) {

        document.getElementById("message").textContent =
            "Register Number must start with 26CS";

        return;

    }


    fetch("/login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            reg_no: reg_no.toUpperCase(),

            password: password

        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("message").textContent =
            data.message;


        if (data.success) {

            window.location.href =
                "mobile.html?reg_no=" +
                encodeURIComponent(reg_no.toUpperCase());

        }

    })

    .catch(error => {

        console.log(error);

        document.getElementById("message").textContent =
            "Server error";

    });

}


/* TEACHER LOGIN */

function teacherLogin() {

    const teacher_id =
        document.getElementById("teacherId").value.trim();

    const password =
        document.getElementById("teacherPassword").value;


    if (!teacher_id || !password) {

        document.getElementById("message").textContent =
            "Please enter Teacher ID and Password";

        return;

    }


    fetch("/teacher-login", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            teacher_id: teacher_id,

            password: password

        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("message").textContent =
            data.message;

        if (data.success) {

            window.location.href =
                "teacher.html";

        }

    })

    .catch(error => {

        console.log(error);

        document.getElementById("message").textContent =
            "Server error";

    });

}


/* STUDENT REGISTRATION */

function registerStudent() {

    const reg_no =
        document.getElementById("newRegNo").value.trim();

    const password =
        document.getElementById("newPassword").value;

    const mobile =
        document.getElementById("newMobile").value.trim();


    if (!reg_no || !password || !mobile) {

        document.getElementById("message").textContent =
            "Please enter all details";

        return;

    }


    if (!/^26CS\d+$/i.test(reg_no)) {

        document.getElementById("message").textContent =
            "Register Number must start with 26CS";

        return;

    }


    fetch("/register-student", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            reg_no: reg_no.toUpperCase(),

            password: password,

            mobile: mobile

        })

    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("message").textContent =
            data.message;


        if (data.success) {

            document.getElementById("newRegNo").value = "";

            document.getElementById("newPassword").value = "";

            document.getElementById("newMobile").value = "";

            setTimeout(() => {

                showStudent();

            }, 1500);

        }

    })

    .catch(error => {

        console.log(error);

        document.getElementById("message").textContent =
            "Server error";

    });

}

</script>

</body>

</html>
