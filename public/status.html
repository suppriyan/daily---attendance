<!DOCTYPE html>

<html>

<head>

<title>Attendance Status</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    min-height: 100vh;

    padding: 40px 20px;

    background:
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

}

.container {

    max-width: 800px;

    margin: auto;

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.25);

}

h1 {

    text-align: center;

    color: #5b21b6;

}

.reg {

    text-align: center;

    font-size: 18px;

}

.percentage {

    text-align: center;

    padding: 25px;

    margin: 20px 0;

    border-radius: 15px;

    background: #ede9fe;

}

.percentage h2 {

    font-size: 45px;

    color: #6d28d9;

    margin: 5px;

}

.cards {

    display: flex;

    gap: 20px;

    margin-bottom: 25px;

}

.card {

    flex: 1;

    padding: 20px;

    text-align: center;

    border-radius: 15px;

    color: white;

}

.present {

    background: #16a34a;

}

.absent {

    background: #dc2626;

}

.card h2 {

    font-size: 35px;

    margin: 5px;

}

table {

    width: 100%;

    border-collapse: collapse;

}

th {

    background: #6d28d9;

    color: white;

    padding: 14px;

}

td {

    padding: 13px;

    text-align: center;

    border-bottom: 1px solid #ddd;

}

.present-status {

    color: #16a34a;

    font-weight: bold;

}

.absent-status {

    color: #dc2626;

    font-weight: bold;

}

button {

    width: 100%;

    padding: 14px;

    margin-top: 20px;

    border: none;

    border-radius: 10px;

    background: #6d28d9;

    color: white;

    font-size: 16px;

    cursor: pointer;

}

@media(max-width:600px) {

    .cards {

        flex-direction: column;

    }

}

</style>

</head>


<body>


<div class="container">

    <h1>📊 Attendance Status</h1>


    <p class="reg">

        Register Number:

        <strong id="regNo"></strong>

    </p>


    <div class="percentage">

        <p>Overall Attendance</p>

        <h2 id="percentage">

            0%

        </h2>

    </div>


    <div class="cards">


        <div class="card present">

            <p>Present</p>

            <h2 id="present">

                0

            </h2>

        </div>


        <div class="card absent">

            <p>Absent</p>

            <h2 id="absent">

                0

            </h2>

        </div>


    </div>


    <table>

        <thead>

            <tr>

                <th>Date</th>

                <th>Status</th>

            </tr>

        </thead>


        <tbody id="attendanceTable">

        </tbody>

    </table>


    <button onclick="goBack()">

        ⬅ Back

    </button>

</div>


<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const reg_no =
    params.get("reg_no");


document.getElementById(
    "regNo"
).textContent =
    reg_no || "Unknown";



function loadAttendance() {

    fetch(
        "/attendance/" +
        encodeURIComponent(reg_no)
    )

    .then(response =>
        response.json()
    )

    .then(data => {

        if (!data.success) {
            return;
        }


        const records =
            data.attendance;


        let present = 0;

        let absent = 0;


        const table =
            document.getElementById(
                "attendanceTable"
            );


        table.innerHTML = "";


        records.forEach(record => {


            if (
                record.status ===
                "Present"
            ) {

                present++;

            } else {

                absent++;

            }


            const row =
                document.createElement(
                    "tr"
                );


            const date =
                document.createElement(
                    "td"
                );


            date.textContent =
                record.attendance_date;


            const status =
                document.createElement(
                    "td"
                );


            if (
                record.status ===
                "Present"
            ) {

                status.textContent =
                    "✅ Present";

                status.className =
                    "present-status";

            } else {

                status.textContent =
                    "❌ Absent";

                status.className =
                    "absent-status";

            }


            row.appendChild(date);

            row.appendChild(status);

            table.appendChild(row);

        });


        const total =
            present + absent;


        const percentage =
            total > 0
            ? ((present / total) * 100)
                .toFixed(2)
            : 0;


        document.getElementById(
            "present"
        ).textContent =
            present;


        document.getElementById(
            "absent"
        ).textContent =
            absent;


        document.getElementById(
            "percentage"
        ).textContent =
            percentage + "%";

    });

}



function goBack() {

    window.location.href =
        "mobile.html?reg_no=" +
        encodeURIComponent(reg_no);

}



loadAttendance();

</script>


</body>

</html>
